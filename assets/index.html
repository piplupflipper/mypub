<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>mypub</title>
<!--
  一覧ページ。中身は bin/mypub が書き出す index.json から JS で組み立てる。
  このファイル自体は bin/mypub が書き換えない。
  既定は非推奨 (index.json の deprecated: true) でないページの一覧で、?view=graveyard では非推奨のページだけを出す (墓場)。
  サムネの iframe は表示するカードにだけ置き、版に固定した /<slug>/v/<latest>/_page (_headers で immutable) を読む。隠すカードからは外す。
  配色は _mypub/open-night.css のトークン、背景は _mypub/night-sky/ の夜空。どちらもダーク専用。
-->
<link rel="stylesheet" href="/_mypub/open-night.css">
<link rel="stylesheet" href="/_mypub/night-sky/night-sky.css">
<style>
:root {
  --fg: var(--color-text); --bg: var(--color-page-bg); --card: var(--color-bg); --muted: var(--color-text-dim);
  --line: var(--color-border); --link: var(--color-accent-strong); --pill: var(--color-bg-alt); --thumb: var(--color-bg-sunken);
  --focus: var(--color-accent);
  --danger: var(--color-danger); --danger-ink: var(--color-accent-ink);
}
body { padding: 24px 16px 48px; color: var(--fg); font: 15px/1.6 system-ui, sans-serif; }
/* 夜空 (.night-sky、z-index 0 の fixed 要素) より手前に出す。 */
main { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0; }
.head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
.count { color: var(--muted); font-size: 13px; }
/* 一覧と墓場を行き来するリンク。見出し行の右端に置く。 */
.view-link { margin-left: auto; color: var(--link); font-size: 13px; text-decoration: none; white-space: nowrap; }
.view-link:hover { text-decoration: underline; }
/* 墓場の印。見出しの脇と、墓場のカードに出す。外枠ページのヘッダーの「非推奨」と同じ色にする。 */
.view-mark, .deprecated-mark { padding: 0 8px; border-radius: 999px; background: var(--danger); color: var(--danger-ink); font-weight: 700; }
.view-mark { font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.controls input, .controls select {
  font: inherit; color: inherit; background: var(--card);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px;
}
.controls input { flex: 1 1 260px; min-width: 0; }
.controls select { flex: 0 0 auto; }
.genres { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
.genres button {
  font: inherit; font-size: 13px; color: var(--muted); background: var(--pill);
  border: 1px solid transparent; border-radius: 999px; padding: 2px 12px; cursor: pointer;
}
.genres button[aria-pressed="true"] { color: var(--fg); background: var(--card); border-color: var(--line); font-weight: 600; }
.genres .n { margin-left: 4px; font-variant-numeric: tabular-nums; opacity: .8; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.status { color: var(--muted); }
.grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; box-shadow: 0 1rem 3rem rgb(0 0 0 / 25%); backdrop-filter: blur(12px); }
.card a { display: block; color: inherit; text-decoration: none; height: 100%; }
.card a:hover .title { color: var(--link); text-decoration: underline; }
/* サムネ。元の HTML を 4 倍の大きさの iframe で読み込み、1/4 に縮めて表示する。 */
.thumb { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: var(--thumb); border-bottom: 1px solid var(--line); }
.thumb iframe {
  position: absolute; top: 0; left: 0; width: 400%; height: 400%;
  transform: scale(.25); transform-origin: 0 0; border: 0; pointer-events: none; background: var(--thumb);
}
.meta { padding: 10px 12px 12px; }
.title { font-size: 15px; font-weight: 600; margin: 0 0 4px; overflow-wrap: anywhere; }
.desc { margin: 0 0 6px; color: var(--muted); font-size: 13px; }
.info { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.genre { padding: 0 8px; border-radius: 999px; background: var(--pill); }
.slug { margin-left: auto; }
</style>
</head>
<body>
<main>
<div class="head">
  <h1>mypub</h1><span class="view-mark" id="view-mark" hidden>🪦 墓場</span><span class="count" id="count"></span>
  <a class="view-link" id="view-link" href="?view=graveyard">🪦 墓場</a>
</div>
<div class="controls">
  <input type="search" id="q" placeholder="title・slug・ジャンル・説明で検索" aria-label="検索">
  <select id="sort" aria-label="並び順">
    <option value="updated-desc">更新が新しい順</option>
    <option value="updated-asc">更新が古い順</option>
    <option value="created-desc">作成が新しい順</option>
    <option value="created-asc">作成が古い順</option>
    <option value="title">タイトル順</option>
  </select>
</div>
<nav class="genres" id="genres" aria-label="ジャンル"></nav>
<p class="status" id="status" hidden></p>
<ul class="grid" id="list"></ul>
</main>
<script>
(() => {
  const ALL = "";
  const NONE = "\u0000none";
  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, children = []) => {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  };

  // 絞り込みの状態は URL のクエリに持たせる。再読み込みや戻るで復元できる。
  // view は一覧 (list) か墓場 (graveyard)。墓場は非推奨のページだけを、一覧はそれ以外を出す。
  const GRAVEYARD = "graveyard";
  const params = new URLSearchParams(location.search);
  const state = {
    view: params.get("view") === GRAVEYARD ? GRAVEYARD : "list",
    q: params.get("q") || "",
    genre: params.has("genre") ? (params.get("genre") || NONE) : ALL,
    sort: params.get("sort") || "updated-desc",
  };
  let pages = [];
  let loaded = false;
  const cards = new Map();

  const saveState = () => {
    const p = new URLSearchParams();
    if (state.view === GRAVEYARD) p.set("view", GRAVEYARD);
    if (state.q) p.set("q", state.q);
    if (state.genre !== ALL) p.set("genre", state.genre === NONE ? "" : state.genre);
    if (state.sort !== "updated-desc") p.set("sort", state.sort);
    const qs = p.toString();
    history.replaceState(null, "", qs ? `?${qs}` : location.pathname);
  };

  const sorters = {
    "updated-desc": (a, b) => b.updated.localeCompare(a.updated) || a.slug.localeCompare(b.slug),
    "updated-asc": (a, b) => a.updated.localeCompare(b.updated) || a.slug.localeCompare(b.slug),
    "created-desc": (a, b) => b.created.localeCompare(a.created) || a.slug.localeCompare(b.slug),
    "created-asc": (a, b) => a.created.localeCompare(b.created) || a.slug.localeCompare(b.slug),
    "title": (a, b) => a.title.localeCompare(b.title, "ja"),
  };

  const matches = (page, terms) => {
    const hay = [page.title, page.slug, page.genre, page.desc].join("\n").toLowerCase();
    return terms.every((t) => hay.includes(t));
  };

  // 今の view に出すページ。ジャンルの件数も、この集合で数える。
  const inView = (p) => (state.view === GRAVEYARD) === p.deprecated;

  const renderGenres = (viewPages) => {
    const counts = new Map();
    for (const p of viewPages) {
      const g = p.genre || NONE;
      counts.set(g, (counts.get(g) || 0) + 1);
    }
    const names = [...counts.keys()].filter((g) => g !== NONE).sort((a, b) => a.localeCompare(b, "ja"));
    if (counts.has(NONE)) names.push(NONE);
    if (state.genre !== ALL && !counts.has(state.genre)) state.genre = ALL;
    const button = (value, label, n) => {
      const b = el("button", { type: "button" }, [label, el("span", { className: "n", textContent: n })]);
      b.setAttribute("aria-pressed", String(state.genre === value));
      b.addEventListener("click", () => { state.genre = value; render(); });
      return b;
    };
    $("genres").replaceChildren(
      button(ALL, "すべて", viewPages.length),
      ...names.map((g) => button(g, g === NONE ? "未分類" : g, counts.get(g))),
    );
  };

  // サムネの iframe。カードを表示するときに作り、隠すときに外す (render)。
  // 版に固定した URL は _headers で immutable のキャッシュが付くので、作り直しても再検証のリクエストが出ない。
  const thumbFrame = (p) => el("iframe", { src: `./${p.slug}/v/${p.latest}/_page`, loading: "lazy", tabIndex: -1, title: "" });

  const card = (p) => {
    const thumb = el("div", { className: "thumb" });
    // サムネは見た目だけのもの。中のリンクやフォーカスに触れないようにする。
    thumb.inert = true;
    thumb.setAttribute("aria-hidden", "true");
    const info = [];
    if (p.deprecated) info.push(el("span", { className: "deprecated-mark", textContent: "非推奨" }));
    if (p.genre) info.push(el("span", { className: "genre", textContent: p.genre }));
    info.push(el("time", { dateTime: p.updated, textContent: `更新 ${p.updated}` }));
    if (p.created !== p.updated) info.push(el("time", { dateTime: p.created, textContent: `作成 ${p.created}` }));
    info.push(el("span", { className: "slug", textContent: p.slug }));
    const meta = [el("h2", { className: "title", textContent: p.title })];
    if (p.desc) meta.push(el("p", { className: "desc", textContent: p.desc }));
    meta.push(el("p", { className: "info" }, info));
    return el("li", { className: "card" }, [
      el("a", { href: `./${p.slug}/` }, [thumb, el("div", { className: "meta" }, meta)]),
    ]);
  };

  // 見出し行。墓場では h1 の脇に印を出し、右端のリンクを一覧へ戻るものにする。
  // 墓場の件数は index.json を読めてから出す。
  const renderView = () => {
    const graveyard = state.view === GRAVEYARD;
    const buried = pages.filter((p) => p.deprecated).length;
    $("view-mark").hidden = !graveyard;
    const link = $("view-link");
    link.textContent = graveyard ? "← 一覧へ" : `🪦 墓場${loaded ? ` (${buried})` : ""}`;
    link.href = graveyard ? location.pathname : `?view=${GRAVEYARD}`;
    document.title = graveyard ? "墓場 · mypub" : "mypub";
  };

  const render = () => {
    const viewPages = pages.filter(inView);
    renderView();
    renderGenres(viewPages);
    const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    const shown = viewPages
      .filter((p) => state.genre === ALL || (p.genre || NONE) === state.genre)
      .filter((p) => matches(p, terms))
      .sort(sorters[state.sort] || sorters["updated-desc"]);
    $("count").textContent = shown.length === viewPages.length ? `${viewPages.length} 件` : `${shown.length} / ${viewPages.length} 件`;
    const status = $("status");
    status.hidden = shown.length > 0;
    if (viewPages.length > 0) status.textContent = "条件に合うページはありません。";
    else status.textContent = state.view === GRAVEYARD ? "非推奨のページはありません。" : "公開済みのページはありません。";
    // カードは最初に 1 度だけ作り、絞り込みは hidden で切り替える。
    // 隠したカードに読み込み済みの iframe を残すと、表示に戻すときに iframe の中の文書の再レイアウトで描画が止まる (issue #9)。
    // そこで隠すカードからは iframe を外し、表示するカードのうち iframe の無いものにだけ作る。
    // 表示したままのカードの iframe には触れないので、検索で文字を打つたびに読み込み直すことはない。
    // 並び順が変わったカードだけを動かす。iframe を外してから動かし、動かしてから作るので、隠すカードと新たに出すカードはどう動かしても読み込みは増えない。
    // 表示したまま並び順だけ変わるカード (並び替え、絞り込み) は、moveBefore なら iframe の状態を保って動かせる。
    // moveBefore が無いブラウザでは、そのカードのサムネが読み込み直しになる (immutable のキャッシュから返る)。
    const list = $("list");
    const visible = new Set(shown.map((p) => p.slug));
    const order = [...shown, ...pages.filter((p) => !visible.has(p.slug))];
    order.forEach((p, i) => {
      const li = cards.get(p.slug);
      const show = visible.has(p.slug);
      const thumb = li.querySelector(".thumb");
      li.hidden = !show;
      if (!show) thumb.replaceChildren();
      const at = list.children[i] || null;
      if (li !== at) {
        if (list.moveBefore && li.isConnected) list.moveBefore(li, at);
        else list.insertBefore(li, at);
      }
      if (show && !thumb.firstChild) thumb.append(thumbFrame(p));
    });
    saveState();
  };

  renderView();
  $("q").value = state.q;
  $("sort").value = sorters[state.sort] ? state.sort : "updated-desc";
  state.sort = $("sort").value;
  $("q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
  $("sort").addEventListener("change", (e) => { state.sort = e.target.value; render(); });
  // 一覧と墓場の切り替えはページを読み込み直さずに行う。index.json を取り直さず、カードも作り直さないため。
  // 新しいタブで開くとき (修飾キー、中クリック) は href のとおりに開く。
  $("view-link").addEventListener("click", (e) => {
    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    state.view = state.view === GRAVEYARD ? "list" : GRAVEYARD;
    render();
  });

  fetch("./index.json", { cache: "no-cache" })
    .then((r) => {
      if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
      return r.json();
    })
    .then((json) => {
      pages = json.map((p) => ({ ...p, genre: p.genre || "", desc: p.desc || "", deprecated: p.deprecated === true }));
      for (const p of pages) cards.set(p.slug, card(p));
      loaded = true;
      render();
    })
    .catch((err) => {
      const status = $("status");
      status.hidden = false;
      status.textContent = `一覧を読み込めませんでした (${err.message})`;
    });
})();
</script>
<script type="module">
  import { mountNightSkyBackground } from "/_mypub/night-sky/night-sky.js";
  mountNightSkyBackground(document.body);
</script>
</body>
</html>
